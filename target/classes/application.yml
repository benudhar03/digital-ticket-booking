server:
  port: 9080

spring:
  application:
    name: digital-ticket-booking

  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/booking_db
      username: postgres
      password: ${DB_PASSWORD:P@ssw0rd}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 10
      minimum-idle: 2

    replica:
      # Temporary: same DB until the actual replica is configured.
      # Later change port 5432 to 5433.
      jdbc-url: jdbc:postgresql://localhost:5432/booking_db
      username: postgres
      password: ${DB_PASSWORD:P@ssw0rd}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 10
      minimum-idle: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      jdbc:
        time_zone: UTC
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
booking:
  seat-lock-ttl-seconds: 300

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: true